name: aegis
type: capability
version: 1.0.0
description: "Governance harness with outcome-learning loop: deterministic rule gate, live label collection, deterministic failure predictor (not yet trained/calibrated), and SwarmLab-derived release gates."

provides:
  - governance-harness
  - rule-gater
  - tool-use-benchmark
  - live-label-pipeline
  - swarmlab-evidence-gate
  - swarmlab-runtime-policy
  - delegated-approval-authority

requires:
  tools: []
  capabilities:
    - name: swarmlab
      optional: true
    - name: sonder
      optional: true
    - name: aop
      optional: true
    - name: lattice
      optional: true
    - name: engram
      optional: true
    - name: parliament
      optional: true
    - name: awm
      optional: true
  context: []

budget:
  index: 20
  summary: 200
  standard: 1250
  deep: 2500

activation:
  triggers:
    - type: pattern
      match: "(aegis|governance harness|aegis-bench|aegis-hook|aegis-collect|action_failed|tool_use_id|SwarmLab evidence gate|value-echo|handoff policy)"
  trigger_logic: OR
  co_activates:
    - swarmlab
    - awm
    - lattice
    - sonder
  conflicts: []

permissions:
  data:
    aegis_metadata: read-only

behavioral:
  core: |
    When discussing or working on Aegis:
    1. Separate deterministic rule-floor claims from predictive/AWM claims.
    2. Do not train on unjoined or ambiguous labels; action_failed=null is truth-preserving, not a nuisance.
    3. Prefer exact tool_use_id joins; fuzzy joins are opt-in and must stay conservative.
    4. Treat SwarmLab retests as evidence-backed release gates (RT-01..RT-37, 37/37). 40 policy ids across RT-07..RT-16 are additionally runtime-wired as `ask` escalations.
    5. Bind delegated approval consumption to the effective consumer and require an explicit, verified, depth-bounded, attenuating, unrevoked chain; do not trust retained root provenance alone.
    6. Check branch/WIP before editing, and `git fetch` first: local checkouts have run >100 commits behind `origin/main`.
    7. Never describe the predictor as calibrated or trained. It is a hand-weighted deterministic engine; only the rule floor and evidence gate are proven.
  overlays: []

verification:
  checklist:
    - "Checked /Users/beauxwalton/Dev/aegis as canonical local path"
    - "Kept predictive claims tied to real-data benchmark evidence, and did not call the hand-weighted predictor calibrated or trained"
    - "Read origin/main rather than a possibly-stale local checkout"
    - "Preserved fail-open hook behaviour"
    - "Did not guess labels when decision/outcome joins are absent or ambiguous"
    - "Rejected approval delegation when effective consumer, chain verification, attenuation, depth, or revocation truth was missing"
